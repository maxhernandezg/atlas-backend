# Levanta solo la API + PostgreSQL. Para el stack completo (API + Front) usar
# el docker-compose del repositorio de automatizacion.
services:
  atlas-postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-atlas}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${PORT_POSTGRES:-15432}:5432"
    volumes:
      - ./sql/dump-atlas.sql:/tmp/dump-atlas.sql:ro
      - ./sql/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-atlas}"]
      interval: 5s
      timeout: 5s
      retries: 10

  atlas-backend:
    build: .
    environment:
      - PORT=4000
      - DATABASE_URL=postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@atlas-postgres:5432/${POSTGRES_DB:-atlas}
      - NODE_ENV=${NODE_ENV:-production}
      - JWT_SECRET=${JWT_SECRET:-cambiar-por-un-secreto-local}
    ports:
      - "${PORT_BACKEND:-4450}:4000"
    depends_on:
      atlas-postgres:
        condition: service_healthy
